name: Send Scheduled DM

on:
  schedule:
    - cron: '0 19,21,23,1 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run DM script
        run: node send.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}