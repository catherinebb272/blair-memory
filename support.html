<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dumpster Modal</title>
    <style>
/* OVERLAY */

.dumpster-modal-overlay {
 position: fixed;
 inset: 0;
 background: rgba(0,0,0,0.78);
 display: flex;
 align-items: center;
 justify-content: center;
 z-index: 9999;
 padding: 24px;
}


/* MAIN MODAL */

.dumpster-modal {
 width: 920px;
 max-width: 100%;
 height: 520px;

 background: #0F141C;
 border: 1px solid rgba(255, 77, 109, 0.35);

 border-radius: 26px;
 overflow: hidden;

 display: flex;

 box-shadow:
 0 0 40px rgba(255, 77, 109, 0.12),
 0 0 120px rgba(0,0,0,0.6);
}


/* IMAGE SIDE */

.dumpster-image-wrap {
 width: 42%;
 height: 100%;
 overflow: hidden;
 flex-shrink: 0;
}

.dumpster-image {
 width: 100%;
 height: 100%;
 object-fit: cover;
 object-position: center;
 display: block;
}


/* CONTENT SIDE */

.dumpster-content {
 flex: 1;

 padding: 56px 52px;

 display: flex;
 flex-direction: column;
 justify-content: center;

 background:
 radial-gradient(
 circle at top right,
 rgba(255,77,109,0.08),
 transparent 40%
 );
}


/* TYPOGRAPHY */

.dumpster-content h2 {
 margin: 0;

 font-size: 40px;
 line-height: 1.05;

 color: #FF4D6D;
 font-weight: 700;
}

.dumpster-content h3 {
 margin-top: 12px;
 margin-bottom: 24px;

 color: #FFFFFF;
 font-size: 20px;
 font-weight: 500;
}

.dumpster-content p {
 color: #9CA3AF;

 font-size: 16px;
 line-height: 1.6;

 max-width: 360px;

 margin-bottom: 28px;
}


/* PASSWORD INPUT */

.dumpster-password {
 width: 100%;
 max-width: 360px;

 height: 52px;

 background: transparent;

 border: 1px solid rgba(255,255,255,0.18);
 border-radius: 12px;

 padding: 0 18px;

 color: white;
 font-size: 15px;

 outline: none;

 margin-bottom: 28px;

 transition: border-color 0.2s ease;
}

.dumpster-password:focus {
 border-color: #FF4D6D;
}


/* BUTTON ROW */

.dumpster-actions {
 display: flex;
 gap: 14px;
}


/* ACCESS BUTTON */

.access-btn {
 height: 52px;
 padding: 0 28px;

 border: none;
 border-radius: 12px;

 background: #FF4D6D;
 color: white;

 font-size: 15px;
 font-weight: 600;

 cursor: pointer;

 transition: opacity 0.2s ease;
}

.access-btn:hover {
 opacity: 0.9;
}


/* CANCEL BUTTON */

.cancel-btn {
 height: 52px;
 padding: 0 24px;

 background: transparent;

 border: 1px solid rgba(255,255,255,0.18);
 border-radius: 12px;

 color: white;

 font-size: 15px;
 font-weight: 500;

 cursor: pointer;

 transition:
 border-color 0.2s ease,
 background 0.2s ease;
}

.cancel-btn:hover {
 border-color: rgba(255,255,255,0.35);
 background: rgba(255,255,255,0.04);
}


/* MOBILE */

@media (max-width: 820px) {

 .dumpster-modal {
 flex-direction: column;
 height: auto;
 }

 .dumpster-image-wrap {
 width: 100%;
 height: 280px;
 }

 .dumpster-content {
 padding: 36px 28px;
 }

 .dumpster-content h2 {
 font-size: 32px;
 }

}
    </style>
</head>
<body>

<!-- MODAL OVERLAY -->
<div class="dumpster-modal-overlay">

 <!-- MODAL -->
 <div class="dumpster-modal">

 <!-- LEFT IMAGE -->
 <div class="dumpster-image-wrap">
 <img
 src="assets/dumpster-raccoon.png"
 alt="Dumpster Raccoon"
 class="dumpster-image"
 />
 </div>

 <!-- RIGHT CONTENT -->
 <div class="dumpster-content">

 <h2>Dumpster Fire Module</h2>

 <h3>Moderators Only</h3>

 <p>
 Enter password to access, manage and resolve support tickets.
 </p>

 <input
 type="password"
 placeholder="Enter password"
 class="dumpster-password"
 />

 <div class="dumpster-actions">
 <button class="access-btn">
 Access Module
 </button>

 <button class="cancel-btn">
 Cancel
 </button>
 </div>

 </div>

 </div>
</div>

</body>
</html>
